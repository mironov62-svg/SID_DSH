<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус ремонта · ГрандМедТех</title>
    
    <!-- ИКОНКА ВО ВКЛАДКЕ БРАУЗЕРА -->
    <link rel="icon" href="https://mironov62-svg.github.io/SID_DSH/assets/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700%7CPoppins:400,500,600,700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================
           Стили (Компактная версия)
           ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --phone: #ffad00;
            --violet: #9e43fa;
            --violet-2: #a044ff;
            --success: #459647;
            --bg: #101010;
            --bg-panel: rgba(0, 0, 0, 0.45);
            --bg-panel-2: #17151c;
            --text: #ffffff;
            --text-soft: rgba(255, 255, 255, 0.78);
            --text-muted: rgba(255, 255, 255, 0.55);
            --border: rgba(255, 255, 255, 0.12);
            --radius-xl: 15px;
            --radius-md: 8px;
            --radius-lg: 10px;
            
            --grad-header: linear-gradient(272deg, rgb(84, 99, 130) 0%, rgb(92, 66, 131) 98%);
            --grad-btn: linear-gradient(to right, #6a3093 0%, #a044ff 51%, #6a3093 100%);
            --grad-stepper: linear-gradient(135deg, #6a3093 0%, #a044ff 100%);
            
            --box-glow: rgb(119 54 222) -1px 11px 35px -20px, rgb(152 62 212) 1px 1px 20px -30px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Montserrat', Arial, sans-serif;
            font-size: 14px;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(106, 48, 147, 0.4) 0%, transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
        }

        .page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(10px);
            box-shadow: var(--box-glow);
            overflow: visible; /* Разрешаем выход тултипам */
        }

        /* ШАПКА */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 24px;
            background: var(--grad-header);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        .site-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }

        .site-logo img {
            height: 40px;
            width: auto;
            display: block;
        }

        .site-logo-text b {
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            display: block;
            line-height: 1.1;
        }

        .site-logo-text span {
            font-size: 10px;
            opacity: 0.8;
        }

        .site-contacts { text-align: right; }
        .site-contacts a {
            display: block;
            text-decoration: none;
            color: #fff;
            line-height: 1.2;
        }
        .site-phone { color: var(--phone); font-weight: 600; font-size: 16px; }
        .site-mail { font-size: 13px; opacity: 0.9; }

        /* ЗАГОЛОВОК (Ужат на 30%) */
        .header-block {
            padding: 10px 20px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header-block h2 {
            font-size: 19px;
            margin-bottom: 2px;
            color: #fff;
            font-weight: 600;
        }

        .header-block p {
            font-size: 11.5px;
            color: var(--text-soft);
            line-height: 1.3;
            max-width: 600px;
            margin: 0 auto;
        }

        .content { padding: 15px 24px 20px; }

        /* ПОЛЯ ПОИСКА */
        .search-section {
            margin-bottom: 12px;
            padding: 12px 18px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
        }

        .search-section h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        
        .input-group { margin-bottom: 6px; }
        
        .input-group input {
            width: 100%;
            padding: 9px 12px;
            background: #fff;
            border: 1px solid rgba(158, 67, 250, 0.3);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: #333;
            transition: var(--transition);
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--violet);
            box-shadow: 0 0 0 2px rgba(158, 67, 250, 0.2);
        }

        .button-group { display: flex; gap: 10px; margin-top: 8px; }

        button {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--grad-btn);
            background-size: 200%;
            color: white;
            box-shadow: 0 4px 15px rgba(160, 68, 255, 0.3);
        }
        .btn-primary:hover { background-position: right; }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        /* РЕЗУЛЬТАТЫ */
        .results-header {
            font-size: 13px;
            font-weight: 600;
            margin: 15px 0 8px;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-item {
            background: var(--bg-panel-2);
            padding: 15px;
            border-radius: var(--radius-xl);
            margin-bottom: 15px;
            border: 1px solid var(--border);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-field {
            display: flex;
            margin-bottom: 3px;
            font-size: 13px;
        }
        .field-label { width: 120px; color: var(--text-muted); font-weight: 500; flex-shrink: 0; }
        .field-value { flex: 1; color: var(--text-soft); }

        /* STEPPER */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin: 15px 0 5px;
            position: relative;
        }
        
        .step {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex: 1;
        }

        .step-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #222;
            border: 2px solid #444;
            color: #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            margin-bottom: 4px;
            transition: var(--transition);
        }

        .step.active .step-circle {
            background: var(--grad-stepper);
            border-color: var(--violet-2);
            color: white;
            box-shadow: 0 0 8px rgba(160, 68, 255, 0.5);
        }

        .step-label {
            font-size: 8px;
            text-align: center;
            color: var(--text-muted);
            max-width: 55px;
            line-height: 1.1;
        }
        
        .step.active .step-label { color: #d9b3ff; font-weight: 600; }

        /* ЛИНИЯ ПРОГРЕССА */
        .stepper::before {
            content: '';
            position: absolute;
            top: 11px;
            left: 0; right: 0;
            height: 2px;
            background: #333;
            z-index: 1;
        }

        /* ТУЛТИПЫ (Поверх всего) */
        .step-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            padding: 8px 10px;
            background: #1a1a1a;
            border: 1px solid var(--violet);
            border-radius: 6px;
            color: #fff;
            font-size: 10px;
            text-align: center;
            z-index: 9999;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            margin-bottom: 8px;
        }

        .step:hover .step-tooltip {
            visibility: visible;
            opacity: 1;
        }

        /* АДАПТИВ */
        @media (max-width: 600px) {
            .site-header { flex-direction: column; text-align: center; padding: 10px; }
            .site-contacts { text-align: center; margin-top: 8px; }
            .stepper { flex-wrap: wrap; gap: 8px; }
            .stepper::before { display: none; }
            .step { flex: 0 0 45%; flex-direction: row; gap: 8px; margin-bottom: 4px; }
            .step-circle { margin-bottom: 0; width: 20px; height: 20px; font-size: 8px; }
            .step-label { font-size: 9px; text-align: left; max-width: none; }
        }
    </style>
</head>
<body>

    <div class="page">
        <div class="container">
            <!-- ШАПКА -->
            <header class="site-header">
                <a class="site-logo" href="https://grandmedtech.ru/" target="_blank">
                    <!-- Логотип с GitHub -->
                    <img src="https://mironov62-svg.github.io/SID_DSH/assets/logo.png" alt="ГрандМедТех">
                    <div class="site-logo-text">
                        <b>ГрандМедТех</b>
                        <span>Сервис медтехники</span>
                    </div>
                </a>
                <div class="site-contacts">
                    <a class="site-phone" href="tel:+73833110232">8 (383) 311-02-32</a>
                    <a class="site-mail" href="mailto:gmt@gmt54.ru">gmt@gmt54.ru</a>
                </div>
            </header>

            <!-- ЗАГОЛОВОК -->
            <div class="header-block">
                <h2>Проверка статуса ремонта</h2>
                <p>Введите номер квитанции или ID учреждения — мы покажем текущую стадию работ.</p>
            </div>

            <div class="content">
                <!-- ПОИСК ПО КВИТАНЦИИ -->
                <div class="search-section">
                    <h3>🔍 Поиск по № квитанции</h3>
                    <div class="input-group">
                        <input type="text" id="receipt-id" placeholder="Например: 41036" autocomplete="off">
                    </div>
                    <div class="button-group">
                        <button class="btn-primary" onclick="checkByReceipt()">Проверить</button>
                        <button class="btn-secondary" onclick="clearForm()">Очистить</button>
                    </div>
                </div>

                <!-- ПОИСК ПО ID -->
                <div class="search-section">
                    <h3>🏢 Поиск по ID учреждения</h3>
                    <div class="input-group">
                        <input type="text" id="institution-id" placeholder="Например: 12345" autocomplete="off">
                    </div>
                    <div class="button-group">
                        <button class="btn-primary" onclick="checkByInstitution()">Проверить</button>
                        <button class="btn-secondary" onclick="clearForm()">Очистить</button>
                    </div>
                </div>

                <div class="results-header">Результаты:</div>
                <div id="results-container">
                    <div style="padding: 15px; text-align: center; color: #666; font-size: 12px;">
                        Введите данные и нажмите Enter или «Проверить»
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_RECEIPT = 'https://n8n.gmtnsk.ru/webhook/0f1113df-c046-450a-9bf8-5ed77f6c19da';
        const WEBHOOK_INSTITUTION = 'https://n8n.gmtnsk.ru/webhook/62f602d8-3319-40ef-ad4b-696edd331937';

        const STAGES_ORDER = ["Новая", "Решение о ремонте", "Диагностика, ремонт", "Заказаны ЗЧ", "ЗЧ получена", "Готово", "На выдачу"];
        const STAGE_LABELS = {
            "Новая": "Принято", "Решение о ремонте": "Согласование", "Диагностика, ремонт": "Ремонт",
            "Заказаны ЗЧ": "Ждём запчасти", "ЗЧ получена": "Запчасти пришли", "Готово": "Ремонт завершён", "На выдачу": "Готово к выдаче"
        };
        const STAGE_TOOLTIPS = {
            "Новая": "Оборудование зарегистрировано.", "Решение о ремонте": "Менеджер дал разрешение.",
            "Диагностика, ремонт": "Идет диагностика или ремонт.", "Заказаны ЗЧ": "Ожидание деталей.",
            "ЗЧ получена": "Детали получены, ремонт продолжается.", "Готово": "Оформление документов.",
            "На выдачу": "Можно забирать."
        };

        // Обработка Enter
        document.getElementById('receipt-id').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkByReceipt();
        });
        document.getElementById('institution-id').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkByInstitution();
        });

        async function checkByReceipt() {
            const val = document.getElementById('receipt-id').value.trim();
            if(val) fetchData(WEBHOOK_RECEIPT, val, 'receipt');
        }

        async function checkByInstitution() {
            const val = document.getElementById('institution-id').value.trim();
            if(val) fetchData(WEBHOOK_INSTITUTION, val, 'institution');
        }

        async function fetchData(url, value, type) {
            const container = document.getElementById('results-container');
            container.innerHTML = '<div style="padding:20px; text-align:center; color:#aaa;">Загрузка данных...</div>';
            
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ value: value })
                });
                
                let data = await res.json();
                if (!Array.isArray(data)) {
                    if (data.result && Array.isArray(data.result)) data = data.result;
                    else if (data.json && Array.isArray(data.json)) data = data.json;
                    else data = [data];
                }

                renderResults(data, type);
            } catch (e) {
                container.innerHTML = '<div style="color:red; padding:20px; text-align:center;">Ошибка соединения</div>';
            }
        }

        function renderResults(items, type) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            
            if(!items || items.length === 0) {
                container.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">Ничего не найдено</div>';
                return;
            }

            items.forEach(item => {
                const stage = item.stage || item["Стадия"] || "Неизвестно";
                const activeIndex = STAGES_ORDER.findIndex(s => stage.toLowerCase().includes(s.toLowerCase()));
                const idx = activeIndex > -1 ? activeIndex : 0;

                let stepsHtml = '';
                STAGES_ORDER.forEach((s, i) => {
                    const isActive = i <= idx;
                    stepsHtml += `
                        <div class="step ${isActive ? 'active' : ''}">
                            <div class="step-circle">${i+1}</div>
                            <div class="step-label">${STAGE_LABELS[s]}</div>
                            <div class="step-tooltip">${STAGE_TOOLTIPS[s]}</div>
                        </div>
                    `;
                });

                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="result-field"><span class="field-label">Квитанция:</span> <span class="field-value">${item.ticket || item["№ Квитанции"] || "-"}</span></div>
                    <div class="result-field"><span class="field-label">Оборудование:</span> <span class="field-value">${item.equipment || item["Оборудование"] || "-"}</span></div>
                    <div class="result-field"><span class="field-label">Статус:</span> <span class="field-value" style="color:#d9b3ff; font-weight:bold;">${stage}</span></div>
                    
                    <div class="stepper">
                        ${stepsHtml}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function clearForm() {
            document.getElementById('receipt-id').value = '';
            document.getElementById('institution-id').value = '';
            document.getElementById('results-container').innerHTML = '<div style="padding:15px; text-align:center; color:#666; font-size:12px;">Форма очищена</div>';
        }
    </script>
</body>
</html>
